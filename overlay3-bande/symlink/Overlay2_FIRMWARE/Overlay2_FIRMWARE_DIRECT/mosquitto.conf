# =====================================================================================================================================
#      OVERLAY2
#      Name                       : OVERLAY2
#      Version                    : 1.0.0.(18) 
#      Date Created               : 11-13-2026
#      Updated                    : 11-13-2026
#      Author                     : Saifuddin
#      Notes                      : mosquitto.conf for the Overlay2 design. bridge.conf lives on the persistent drive, so include_dir
#                                   points to the persistent store conf.d (/boot/firmware/broker/conf.d is replaced by setup_overlay2.sh; read directly by mosquitto).
#                                   Logs go to syslog (RAM) so the volatile SD never fills up.
# ======================================================================================================================================
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# WebSocket listener (optional)
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

pid_file /run/mosquitto/mosquitto.pid

persistence true
persistence_location /var/lib/mosquitto/

log_dest syslog

include_dir /boot/firmware/broker/conf.d
